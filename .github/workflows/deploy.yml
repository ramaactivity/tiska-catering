name: Deploy to Vercel (Production)

# Deploy lewat Vercel CLI + token (BUKAN native Git integration).
# Alasan: satu GitHub account cuma bisa connect ke SATU akun Vercel dalam
# satu waktu. Beberapa project di akun Vercel berbeda saling rebutan koneksi
# itu, bikin deploy ke-block. CI token bebas dari masalah tsb.
#
# Catatan: install & build dilakukan DI VERCEL (bukan di runner ini) — lebih
# andal & memakai cache Vercel. Runner cuma upload source + trigger deploy.
# Dokumentasi lengkap: lihat deploy.md.

on:
  push:
    branches: [main]

# Cegah dua deploy production jalan barengan. Deploy yang lebih baru
# membatalkan yang sedang berjalan.
concurrency:
  group: production-deploy
  cancel-in-progress: true

# orgId & projectId di-inline dari .vercel/project.json — ini BUKAN rahasia.
# Satu-satunya secret yang perlu kamu tambah di GitHub: VERCEL_TOKEN.
env:
  VERCEL_ORG_ID: team_DrIFTCibqzGWz5gnPFEDQ1mi
  VERCEL_PROJECT_ID: prj_GJiHPUq7mIHhRTMyEs7REIK2ZkcP

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        # Versi dicetak supaya kalau rilis CLI baru merusak pipeline, lognya
        # langsung menunjukkan versi mana yang dipakai saat itu.
        run: |
          npm install -g vercel@latest
          vercel --version

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # WAJIB: buang metadata git sebelum deploy. Tanpa ini, Vercel mencoba
      # mencocokkan email commit-author dengan member akun → di Hobby tier
      # ke-block "commit email could not be matched". Dengan .git dibuang,
      # deploy jadi atas nama pemilik token (bukan commit-author).
      - name: Strip git metadata (hindari block commit-author di Hobby)
        run: rm -rf .git

      - name: Deploy (production)
        # --yes: jangan pernah menunggu jawaban interaktif di CI.
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
